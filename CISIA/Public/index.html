<div class="app" id="app"></div>

<!-- Diagnóstico: se algum arquivo não carregar, mostra qual em vez de deixar a tela branca -->
<script>
(function () {
  var failed = [];
  function show(lines) {
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = '<div style="max-width:640px;margin:48px auto;padding:20px;font:15px/1.5 system-ui,sans-serif;color:#eee;background:#1b1f2a;border:1px solid #444;border-radius:12px">' +
      '<h2 style="margin:0 0 8px">A CISIA não conseguiu carregar</h2>' + lines.join('') + '</div>';
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT' && t.src) {
      failed.push(t.src.replace(location.origin + '/', ''));
      show(['<p>Estes arquivos não foram encontrados (confira se estão nas pastas certas, como no README):</p><ul>' +
        failed.map(function (f) { return '<li><code>' + f + '</code></li>'; }).join('') + '</ul>']);
    } else if (e.message && !failed.length) {
      var app = document.getElementById('app');
      if (app && !app.children.length) show(['<p>Erro de JavaScript:</p><pre style="white-space:pre-wrap">' + e.message + '</pre><p>Abra o Console (F12) para ver o arquivo e a linha.</p>']);
    }
  }, true);
})();
</script>
